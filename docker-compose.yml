services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - ZPPR_CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000"]
      - ZPPR_ADMIN_API_KEY=${ZPPR_ADMIN_API_KEY:-zppr-admin-2026}
    volumes:
      - zppr_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
        INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:8000}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate --protocol http2 --url http://frontend:3000
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped

  cloudflared-named:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel-named"]
    command: tunnel --no-autoupdate --protocol http2 run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  zppr_data:
