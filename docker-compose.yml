services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - ZPPR_CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000"]
      - ZPPR_ADMIN_API_KEY=${ZPPR_ADMIN_API_KEY:-zppr-admin-2026}
    volumes:
      - zppr_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  zppr_data:
